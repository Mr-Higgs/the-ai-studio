<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e1427;
      }
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #wordmark {
        position: absolute;
        top: 345px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 14px;
        color: #ffffff;
      }
      #l1 {
        position: absolute;
        top: 560px;
        left: 120px;
        width: 840px;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -2px;
        line-height: 1.08;
        color: #ffffff;
        transform-origin: 0 0;
      }
      #l1 .accent { color: #f5a623; }
      #l2 {
        position: absolute;
        top: 1130px;
        left: 120px;
        width: 840px;
        font-size: 100px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.1;
        color: #f5a623;
      }
      .grp { display: inline; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="title-card"
      data-start="0"
      data-duration="6.12"
      data-width="1080"
      data-height="1920"
    >
      <div style="position:absolute; inset:0; background:#0e1427;"></div>
      <div id="wordmark">PATTERNED</div>
      <div id="l1"><span class="grp" id="g1">Workforce programs</span> <span class="grp" id="g2">get judged on</span> <span class="grp" id="g3">what happens to people</span> <span class="grp" id="g4"><span class="accent">six months</span> after they leave.</span></div>
      <div id="l2"><span class="grp" id="g5">Almost none of them</span> <span class="grp" id="g6">can tell you.</span></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Reveal times = spoken word start - 0.15s (transcript, source t = output t)
      tl.from("#wordmark", { autoAlpha: 0, y: -20, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.from("#g1", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 0.0);
      tl.from("#g2", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 1.09);
      tl.from("#g3", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 1.73);
      tl.from("#g4", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 2.85);

      // "Almost" spoken at 4.72 — dim line 1 ahead of it, land line 2 with voice
      tl.to("#l1", { opacity: 0.55, scale: 0.94, duration: 0.5, ease: "expo.out" }, 4.3);
      tl.from("#g5", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 4.57);
      tl.from("#g6", { autoAlpha: 0, y: 34, duration: 0.45, ease: "power3.out" }, 5.41);

      window.__timelines["title-card"] = tl;
    </script>
  </body>
</html>
