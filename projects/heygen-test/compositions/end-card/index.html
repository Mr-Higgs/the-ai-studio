<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e1427;
      }
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #wordmark {
        position: absolute;
        top: 345px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 14px;
        color: #ffffff;
      }
      #rule {
        position: absolute;
        top: 415px;
        left: 440px;
        width: 200px;
        height: 4px;
        background: #f5a623;
        transform-origin: 50% 50%;
      }
      #headline {
        position: absolute;
        top: 560px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.08;
        color: #ffffff;
      }
      #sub {
        position: absolute;
        top: 830px;
        left: 120px;
        width: 840px;
        max-width: 840px;
        text-align: center;
        font-size: 40px;
        font-weight: 400;
        color: rgba(255,255,255,0.65);
      }
      #cta {
        position: absolute;
        top: 980px;
        left: 140px;
        width: 800px;
        padding: 30px 0;
        text-align: center;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -1px;
        color: #0e1427;
        background: #f5a623;
        border-radius: 70px;
      }
      #slots {
        position: absolute;
        top: 1180px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 48px;
        font-weight: 600;
        color: #ffffff;
      }
      #handle {
        position: absolute;
        top: 1280px;
        left: 0;
        width: 1080px;
        text-align: center;
        font-size: 40px;
        font-weight: 400;
        color: rgba(255,255,255,0.65);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="end-card"
      data-start="0"
      data-duration="5.0"
      data-width="1080"
      data-height="1920"
    >
      <div style="position:absolute; inset:0; background:#0e1427;"></div>
      <div id="wordmark">PATTERNED</div>
      <div id="rule"></div>
      <div id="headline">The January Cohort<br/>Readiness Pilot</div>
      <div id="sub">15 candidates — verified, matched<br/>and reported on.</div>
      <div id="cta">Book a 20-min Pilot Fit Call</div>
      <div id="slots">5 January pilot slots&nbsp;&nbsp;·&nbsp;&nbsp;closes Dec 19</div>
      <div id="handle">patterned.work&nbsp;&nbsp;·&nbsp;&nbsp;@patternedwork</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#wordmark", { autoAlpha: 0, y: -20, duration: 0.4, ease: "power3.out" }, 0.0);
      tl.from("#rule", { autoAlpha: 0, scaleX: 0, duration: 0.45, ease: "expo.out" }, 0.1);
      tl.from("#headline", { autoAlpha: 0, y: 36, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.from("#sub", { autoAlpha: 0, y: 28, duration: 0.45, ease: "power3.out" }, 1.0);
      tl.from("#cta", { autoAlpha: 0, y: 28, scale: 0.96, duration: 0.45, ease: "power3.out" }, 1.6);
      tl.from("#slots", { autoAlpha: 0, y: 24, duration: 0.45, ease: "power3.out" }, 2.2);
      tl.from("#handle", { autoAlpha: 0, y: 20, duration: 0.45, ease: "power3.out" }, 2.7);

      window.__timelines["end-card"] = tl;
    </script>
  </body>
</html>
